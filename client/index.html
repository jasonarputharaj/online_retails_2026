<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E-Commerce Insights Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f1117;
    color: #e6e6e6;
    padding: 30px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 5px;
  }
  .subtitle {
    color: #9aa0a6;
    margin-bottom: 30px;
  }
  .stats-row {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: linear-gradient(135deg, #1e2130, #262b3d);
    border-radius: 12px;
    padding: 20px 25px;
    flex: 1;
    min-width: 180px;
    border: 1px solid #2f3448;
  }
  .stat-card .label {
    color: #9aa0a6;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .stat-card .value {
    font-size: 26px;
    font-weight: 700;
    color: #5ee6c8;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .card {
    background: #1a1d29;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #2f3448;
  }
  .card h2 {
    font-size: 16px;
    margin-bottom: 15px;
    color: #e6e6e6;
  }
  .full-width { grid-column: span 2; }
  canvas { max-height: 320px; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid #2f3448;
  }
  th { color: #9aa0a6; font-weight: 500; }
  .segment-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .Champions { background: #1b4332; color: #5ee6c8; }
  .Loyal { background: #1e3a5f; color: #6fb5ff; }
  .Regular { background: #3a3a1e; color: #e6d95e; }
  .Risk { background: #4a2a1e; color: #ff9a5e; }
  .Lost { background: #4a1e1e; color: #ff6b6b; }
</style>
</head>
<body>

  <h1>E-Commerce Sales & Customer Insights</h1>
  <div class="subtitle">Built with SQL + Python + Node.js + Chart.js</div>

  <div class="stats-row" id="statsRow"></div>

  <div class="grid">
    <div class="card full-width">
      <h2>Monthly Revenue Trend</h2>
      <canvas id="revenueChart"></canvas>
    </div>

    <div class="card">
      <h2>Top 10 Products by Revenue</h2>
      <canvas id="productsChart"></canvas>
    </div>

    <div class="card">
      <h2>Customer Segments (RFM)</h2>
      <canvas id="segmentChart"></canvas>
    </div>

    <div class="card full-width">
      <h2>Top Customers (RFM Detail)</h2>
      <div style="max-height:300px; overflow-y:auto;">
        <table id="rfmTable">
          <thead>
            <tr><th>Customer ID</th><th>Recency (days)</th><th>Frequency</th><th>Monetary</th><th>Segment</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
const API = "http://localhost:5000/api";

// ---- Stat Cards (Repeat Rate) ----
fetch(`${API}/customers/repeat-rate`)
  .then(r => r.json())
  .then(data => {
    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card">
        <div class="label">Total Customers</div>
        <div class="value">${data.total_customers}</div>
      </div>
      <div class="stat-card">
        <div class="label">Repeat Customers</div>
        <div class="value">${data.repeat_customers}</div>
      </div>
      <div class="stat-card">
        <div class="label">Repeat Purchase Rate</div>
        <div class="value">${data.repeat_rate_pct}%</div>
      </div>
    `;
  });

// ---- Revenue Trend Chart ----
fetch(`${API}/revenue/monthly`)
  .then(r => r.json())
  .then(data => {
    new Chart(document.getElementById('revenueChart'), {
      type: 'line',
      data: {
        labels: data.map(d => d.month),
        datasets: [{
          label: 'Revenue',
          data: data.map(d => d.total_revenue),
          borderColor: '#5ee6c8',
          backgroundColor: 'rgba(94,230,200,0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#9aa0a6' }, grid: { color: '#2f3448' } },
          y: { ticks: { color: '#9aa0a6' }, grid: { color: '#2f3448' } }
        }
      }
    });
  });

// ---- Top Products Chart ----
fetch(`${API}/products/top`)
  .then(r => r.json())
  .then(data => {
    new Chart(document.getElementById('productsChart'), {
      type: 'bar',
      data: {
        labels: data.map(d => d.description.length > 15 ? d.description.slice(0,15)+'…' : d.description),
        datasets: [{
          label: 'Revenue',
          data: data.map(d => d.total_revenue),
          backgroundColor: '#6fb5ff'
        }]
      },
      options: {
        indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#9aa0a6' }, grid: { color: '#2f3448' } },
          y: { ticks: { color: '#9aa0a6' }, grid: { display: false } }
        }
      }
    });
  });

// ---- RFM Segment Pie Chart + Table ----
fetch(`${API}/customers/rfm`)
  .then(r => r.json())
  .then(data => {
    const counts = {};
    data.forEach(d => counts[d.segment] = (counts[d.segment] || 0) + 1);

    new Chart(document.getElementById('segmentChart'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(counts),
        datasets: [{
          data: Object.values(counts),
          backgroundColor: ['#5ee6c8','#6fb5ff','#e6d95e','#ff9a5e','#ff6b6b']
        }]
      },
      options: {
        plugins: { legend: { position: 'bottom', labels: { color: '#e6e6e6' } } }
      }
    });

    const tbody = document.querySelector('#rfmTable tbody');
    data.slice(0, 30).forEach(d => {
      const cls = d.segment.replace(' Customers','').replace(' ','');
      tbody.innerHTML += `
        <tr>
          <td>${d.customer_id}</td>
          <td>${d.recency_days}</td>
          <td>${d.frequency}</td>
          <td>${Number(d.monetary).toLocaleString()}</td>
          <td><span class="segment-badge ${cls}">${d.segment}</span></td>
        </tr>`;
    });
  });
</script>

</body>
</html>
